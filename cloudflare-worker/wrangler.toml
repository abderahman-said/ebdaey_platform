name = "ebdaey-og-worker"
main = "src/worker.ts"
compatibility_date = "2024-11-01"

# Production environment — bound to the custom domain
[env.production]
name = "ebdaey-og-worker"
routes = [
  { pattern = "ebdaey.com/*", custom_domain = false, zone_name = "ebdaey.com" },
  { pattern = "www.ebdaey.com/*", custom_domain = false, zone_name = "ebdaey.com" },
]

[env.production.vars]
# The Lovable origin that actually serves the SPA.
# IMPORTANT: this must NOT be ebdaey.com (would cause an infinite loop).
ORIGIN_HOST = "ebdaey.lovable.app"
SITE_URL    = "https://ebdaey.com"
